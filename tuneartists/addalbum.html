<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-page: hsl(0, 0%, 100%);
            --card-dark: #e4e4e4;
            --border-light: rgba(160, 160, 160, 0.291);
            --text-dark: #000000;
            --text-light: #000000;
            --text-dim: #212121;
        }

        @font-face {
            font-family: 'Nationale Regular';
            src: url('./fonts/Nationale-Regular.woff2') format('woff2');
            font-weight: normal;
        }
        @font-face {
            font-family: 'Nationale Bold';
            src: url('./fonts/Nationale-Bold.woff2') format('woff2');
            font-weight: bold;
        }

        body {
            background-color: var(--bg-page);
            margin: 0;
            font-family: 'Nationale Regular', sans-serif;
        }

        .main-container {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .glass-panel {
            background: var(--card-dark);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); /* Sombra padrão mantida */
            color: var(--text-light);
        }

        /* CARD DE PLAYLIST SEM SOMBRA */
        .glass-panel.no-shadow {
            box-shadow: none !important;
            background: #e4e4e4; /* Mantém a cor, tira a sombra */
        }

        .input-noir {
            background: #e3e3e3 !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: rgb(0, 0, 0) !important;
            border-radius: 12px !important;
            padding: 12px !important;
            font-size: 13px;
            width: 100%;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .upload-zone {
            border: 2px dashed rgba(199, 199, 199, 0.434);
            border-radius: 20px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            background: #ffffff;
        }

        #preview-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 10;
        }

        .btn-submit {
            background: #000000;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 16px;
            border-radius: 12px;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-continue {
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            padding: 10px 25px;
            border-radius: 100px;
            background: #cfef00;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            font-size: 15px;
            color: black;
            text-decoration: none;
        }

        /* CONTAINER PARA CENTRALIZAR O BOTÃO FINAL */
        .btn-center-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 40px;
            grid-column: 1 / -1; /* Garante que ocupe a largura total do grid */
        }

        .btn-continue:hover { background: #c4e201; }
        .btn-continue svg { width: 34px; margin-left: 10px; transition: transform 0.3s ease-in-out; }
        .btn-continue:hover svg { transform: translateX(5px); }
        .btn-continue:active { transform: scale(0.95); }

        .label-noir {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #111111;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
        }

        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding-bottom: 20px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-light);
        }

        .tune-logo-img { width: 108px; height: auto; }
        .top-header-right h2 { margin: 0; font-size: 24px; font-weight: 900; color: var(--text-dark); }

    </style>
</head>
<body>

<div class="main-container">
    <div style="max-width: 1000px; margin: 0 auto;">
        
        <div class="top-header">
            <div class="top-header-left">
                <img src="../assets/tunelogohblack.png" alt="Tune" class="tune-logo-img">
            </div>
            <div class="top-header-right">
                <h2>Novo Álbum</h2>
            </div>
        </div>

      <form id="albumRequestForm" onsubmit="window.handleAlbumSubmission(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
            
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="glass-panel">
                    <span class="label-noir">Capa do Álbum</span>
                    <label for="relCoverAlbum" class="upload-zone">
                        <img id="preview-img" src="" alt="Preview" style="display: none;">
                        <div style="text-align: center;">
                            <span style="font-size: 24px;">+</span>
                            <p style="font-size: 9px; font-weight: 700; margin-top: 10px;">ADICIONAR ARTE DO ÁLBUM</p>
                        </div>
                        <input type="file" id="relCoverAlbum" accept="image/*" style="display: none;" onchange="window.handleImagePreview(this)">
                    </label>
                </div>

                <div class="glass-panel">
                    <span class="label-noir">Duração Total (Ex: 30m)</span>
                    <input type="text" id="duration" placeholder="30m" class="input-noir" required>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="glass-panel">
                    <span class="label-noir">Nome do Álbum</span>
                    <input type="text" id="albumName" placeholder="Ex: O Original" required class="input-noir">
                    
                    <span class="label-noir" style="margin-top: 20px;">Data de Lançamento</span>
                    <input type="date" id="releaseDate" required class="input-noir">

                    <span class="label-noir" style="margin-top: 20px;">Gênero do Álbum</span>
                    <select id="genre" class="input-noir">
                        <option value="Sertanejo">Sertanejo</option>
                        <option value="Funk">Funk</option>
                        <option value="Pop">Pop</option>
                        <option value="Rap">Rap/Trap</option>
                        <option value="R&B">R&B</option>
                    </select>
                </div>

                <div class="glass-panel no-shadow">
                    <span class="label-noir">Importar Músicas (YouTube Playlist)</span>
                    <div style="display: flex; flex-direction: column; gap: 15px; align-items: center;">
                        <input type="text" id="ytPlaylistUrl" placeholder="Link da Playlist do YouTube" class="input-noir">
                        <button type="button" id="btnPreviewTracks" class="btn-submit" style="width: fit-content; padding: 12px 40px;">
                            Confirmar
                        </button>
                    </div>
                    
                    <div id="previewContainer" style="display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                        <p id="trackStatus" style="font-size: 11px; margin-bottom: 10px;"></p>
                        <div id="trackCardsGrid" style="max-height: 300px; overflow-y: auto;"></div>
                    </div>
                </div>
            </div>

            <div class="btn-center-wrapper">
                <button type="submit" id="btnSubmit" class="btn-continue">
                    <span>Enviar para o perfil</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 74 74" height="34" width="34">
                        <circle stroke-width="3" stroke="black" r="35.5" cy="37" cx="37"></circle>
                        <path fill="black" d="M25 35.5C24.1716 35.5 23.5 36.1716 23.5 37C23.5 37.8284 24.1716 38.5 25 38.5V35.5ZM49.0607 38.0607C49.6464 37.4749 49.6464 36.5251 49.0607 35.9393L39.5147 26.3934C38.9289 25.8076 37.9792 25.8076 37.3934 26.3934C36.8076 26.9792 36.8076 27.9289 37.3934 28.5147L45.8787 37L37.3934 45.4853C36.8076 46.0711 36.8076 47.0208 37.3934 47.6066C37.9792 48.1924 38.9289 48.1924 39.5147 47.6066L49.0607 38.0607ZM25 38.5L48 38.5V35.5L25 35.5V38.5Z"></path>
                    </svg>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function handleImagePreview(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('preview-img');
                img.src = e.target.result;
                img.style.display = 'block';
                input.parentElement.querySelector('div').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

</body>
</html>
