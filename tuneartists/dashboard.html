/* Estilos base do botÃ£o */
    .btn {
    
        font-family: 'Nationale Bold'; /* Corrigido para evitar conflito com a anterior */
      background-color: #ffffff; /* fundo branco */
      color: #000000; /* texto preto */
      border: 2px solid #000000;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 80px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    /* AnimaÃ§Ã£o ao passar o mouse */
    .btn:hover {
      background-color: #f0f0f0;
      transform: translateY(-3px); /* levanta o botÃ£o */
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    /* AnimaÃ§Ã£o ao clicar */
    .btn:active {
      transform: translateY(1px); /* "pressiona" o botÃ£o */
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Adicionando um efeito de brilho ao passar o mouse */
    .btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      transform: rotate(45deg) translateY(-100%);
      transition: transform 0.5s ease;
    }

    .btn:hover::after {
      transform: rotate(45deg) translateX(100%);
    }

        .btnlic {
    
        font-family: 'Nationale Bold'; /* Corrigido para evitar conflito com a anterior */

    }
